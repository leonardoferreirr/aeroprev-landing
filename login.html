<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Painel AeroPrev</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/instrument-sans-normal-400-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="corpo-entrada">

  <main class="entrada">
    <div class="entrada-cartao">
      <img class="entrada-marca" src="assets/img/logo.svg" alt="AeroPrev" width="150" height="48">
      <h1>Painel do escritório</h1>
      <p class="entrada-sub">Acesso restrito à equipe da Sartoti &amp; Wöhlke.</p>

      <form id="formEntrada" novalidate>
        <div class="entrada-campo">
          <label for="usuario">E-mail</label>
          <input type="email" id="usuario" name="usuario" autocomplete="username"
                 autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="entrada-campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" autocomplete="current-password" required>
        </div>
        <p class="entrada-erro" id="erro" role="alert" hidden></p>
        <button class="bt bt-cheio entrada-bt" type="submit">Entrar</button>
      </form>

      <p class="entrada-aviso">
        Acesso exclusivo da equipe. Em caso de dúvida com a senha, procure o
        responsável pelo painel no escritório.
      </p>
    </div>
  </main>

  <script src="assets/js/supabase.js" defer></script>
  <script src="assets/js/entrada.js" defer></script>
</body>
</html>
