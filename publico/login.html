<body class="corpo-entrada">

  <main class="entrada">
    <div class="entrada-cartao">
      <img class="entrada-marca" src="assets/img/logo.svg" alt="AeroPrev" width="150" height="48">
      <h1>Painel do escritório</h1>
      <p class="entrada-sub">Acesso restrito à equipe da Sartori &amp; Wöhlke.</p>

      <form id="formEntrada" novalidate>
        <div class="entrada-campo">
          <label for="usuario">Usuário</label>
          <input type="text" id="usuario" name="usuario" autocomplete="username"
                 autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="entrada-campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" autocomplete="current-password" required>
        </div>
        <p class="entrada-erro" id="erro" role="alert" hidden></p>
        <button class="bt bt-cheio entrada-bt" type="submit">Entrar</button>
      </form>

      <p class="entrada-aviso">
        <strong>Demonstração.</strong> Esta tela mostra como o acesso vai funcionar,
        mas ainda não protege o painel: a verificação acontece no próprio navegador.
        A proteção de verdade depende de um servidor, e entra junto com o banco
        de dados.
      </p>
    </div>
  </main>

  <script src="assets/js/entrada.js" defer></script>
</body>
